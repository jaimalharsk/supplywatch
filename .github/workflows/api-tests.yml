name: API Tests

on:
  push:
  pull_request:

jobs:
  postman-newman:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supplywatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: SupplyWatch
      APP_VERSION: 0.1.0
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/supplywatch
      RESEND_API_KEY: ""
      RESEND_FROM_EMAIL: alerts@supplywatch.local
      ENABLE_SCHEDULER: "false"
      DEFAULT_RATE_LIMIT_FREE: "100"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: supplywatch
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start SupplyWatch API (uvicorn)
        working-directory: supplywatch
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo "Started uvicorn in background"

      - name: Wait for API to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done
          echo "API did not become healthy in time"
          cat supplywatch/uvicorn.log || true
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Postman collection with Newman
        run: |
          npx newman run postman/supplywatch.postman_collection.json \
            -e postman/supplywatch.postman_environment.json \
            --env-var baseUrl=http://127.0.0.1:8000

      - name: Dump API logs on failure
        if: failure()
        run: cat supplywatch/uvicorn.log || true
