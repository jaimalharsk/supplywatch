services:
  - type: web
    name: supplywatch-demo
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements_demo.txt
    startCommand: uvicorn demo_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
